<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Cloud -->
  <path d="M310 310 C 310 310
           391.088 194.16 490 230
           C 510 170 580 140
           640 160 C 710 160
           760 210 760 270
           C 830 270 880
           310 880 360 C 880
           410 830 440 760
           440 L 460 440 C 460
           440 224.034 476.893 310 310 Z"
    fill="#e5e7eb"/>

  <!-- Kubernetes hex hint -->
  <g stroke="#3b82f6" stroke-width="6" opacity="0.5" fill="none">
    <polygon points="600,180 700,240 700,360 600,420 500,360 500,240"/>
    <line x1="600" y1="180" x2="600" y2="420"/>
    <line x1="500" y1="300" x2="700" y2="300"/>
  </g>

  <!-- Orbit -->
  <ellipse cx="610" cy="288" rx="300" ry="120"
           transform="rotate(-17 640 340)"
           fill="none"
           stroke="#3b82f6"
           stroke-width="6"
           opacity="0.25"/>

  <!-- Rocket -->
  <g transform="rotate(30 800 400)">
    <!-- Body -->
    <path d="M600 160
             c70 90 70 210 0 300
             c-70-90-70-210 0-300z"
          stroke="#3b82f6"
          fill="#f9fafb"/>

    <!-- Window -->
    <circle cx="600" cy="300" r="14" fill="#3b82f6"/>

    <!-- Fins -->
    <path d="M560 340 l-40 50 l40 0 z" fill="#d1d5db" stroke="#3b82f6" transform="rotate(-16 600 380)"/>
    <path d="M640 340 l40 50 l-40 0 z" fill="#d1d5db" stroke="#3b82f6" transform="rotate(16 600 380)"/>

    <!-- Flame (layered) -->
    <path d="M600 480
           c-25 60-70 90-70 130
           c40-15 70-15 70-15
           c0 0 30 0 70 15
           c0-40-45-70-70-130z"
        fill="#f27405"/>
    <path d="M600 500
           c-15 40-40 60-40 90
           c25-10 40-10 40-10
           c0 0 15 0 40 10
           c0-30-25-50-40-90z"
        fill="#C03232"
        opacity="0.8"/>
  </g>

  <!-- Node dots along orbit -->
  <circle cx="260" cy="340" r="6" fill="#60a5fa"/>
  <circle cx="420" cy="280" r="6" fill="#60a5fa"/>
  <circle cx="740" cy="280" r="6" fill="#60a5fa"/>
  <circle cx="900" cy="340" r="6" fill="#60a5fa"/>
  <circle cx="740" cy="400" r="6" fill="#60a5fa"/>
  <circle cx="420" cy="400" r="6" fill="#60a5fa"/>

  <!-- Name -->
  <text x="600" y="570"
        text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="56"
        font-weight="500"
        fill="#e5e7eb">
    Davide Foschi
  </text>
</svg>
